name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ping Supabase REST Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status Code: $response"

          if [ "$response" -ne 200 ]; then
            echo "Error: Keep-alive request failed with status $response"
            exit 1
          fi

      - name: Update Activity Heartbeat File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          date -u > .heartbeat
          git add .heartbeat
          git commit -m "chore: keep-alive heartbeat [skip ci]" || exit 0
          git push origin main
