name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well within Supabase's 7-day pause window)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI to test

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status Code: $response"

          if [ "$response" -ne 200 ]; then
            echo "Error: Keep-alive request failed with status $response"
            exit 1
          fi
